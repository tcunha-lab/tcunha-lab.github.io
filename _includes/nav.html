<header class="site-header">
  <div class="container site-header__inner">
    <a href="{{ '/' | relative_url }}" class="site-brand">
      <span class="site-brand__name">{{ site.title }}</span>
    </a>

    <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    <nav class="site-nav" aria-label="Primary">
      <ul>
        {% for item in site.data.nav %}
          {% assign current = false %}
          {% if page.url == item.url %}{% assign current = true %}{% endif %}
          {% if item.url != '/' and page.url contains item.url %}{% assign current = true %}{% endif %}
          <li>
            <a href="{{ item.url | relative_url }}"
               class="site-nav__link{% if current %} is-active{% endif %}">
              {{ item.name }}
            </a>
          </li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
