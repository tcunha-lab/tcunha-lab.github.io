- name: Kussum Ghimire
  role: MS in Biology
  role_group: grad
  bio: genomics, bioinformatics, conservation, woman in STEAM
  long_bio: >-
    I am a Biology graduate student and an aspiring genomics researcher. I am passionate about investigating what
    genomic data can tell us about life, diversity, and survival./nn I'm currently working toward generating the first
    whole-genome assembly for a native North American freshwater mussel species for my masters thesis. Catch me in the
    lab and at my computer! My work brings together both wet-lab and computational components, including high molecular
    weight DNA extraction, genomic library preparation, sequencing, and bioinformatic analyses for genome assembly and
    annotation./nn Long-term, I'm interested in exploring adaptation of organisms in extreme environments through
    genomics and how those findings can inform conservation decisions and protect biodiversity./nn Outside the lab, I
    recharge through painting, DIY crafts, singing, and reading.
  photo: /assets/images/team/kussum-ghimire.jpg
