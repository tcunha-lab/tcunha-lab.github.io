- name: Tauana Cunha, PhD
  role: Assistant Professor
  role_group: pi
  long_bio: >-
    PhD, Harvard University, 2019/n

    BSc, Universidade de São Paulo, 2012/n


    Tauana grew up and started her career in Brazil, fascinated by the beautiful diversity of small invertebrate
    critters that dominate the oceans. After obtaining her bachelor's at USP and PhD at Harvard, she became a
    Smithsonian Institution Postdoctoral Fellow at STRI in Panamá, and then the Women's Board Postdoctoral Scientist at
    the Field Museum of Natural History in Chicago. In 2025, Tauana joined the faculty of the Department of Biology at
    Loyola University Chicago.
