---
layout: default
---
<article class="page">
  {% unless page.hide_title %}
  <header class="page-header container" data-reveal>
    <h1 class="page-header__title">{{ page.title }}</h1>
    {% if page.subtitle %}<p class="page-header__subtitle">{{ page.subtitle }}</p>{% endif %}
  </header>
  {% endunless %}

  <div class="page-body container" data-reveal>
    {{ content }}
  </div>
</article>
